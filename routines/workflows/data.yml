name: MLB Data Pre-fetch

# Manual only since 2026-11-16. The picks routines now run
# scripts/fetch_daily_data.py themselves, inside their own session, so the
# data is as fresh as the card. The old 9:00 AM ET schedule was started by
# GitHub five to ten hours late every day, reached the 11 AM card zero times,
# and committed an empty bundle on every day of the off-season. Kept as a
# button for pulling a past date's bundle into data/.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date override (YYYY-MM-DD, blank = today ET)'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Resolve date (ET)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch MLB data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p data
          python3 scripts/fetch_daily_data.py \
            --date "${{ steps.date.outputs.date }}" \
            --out-dir data

      - name: Commit and push
        run: |
          git config user.email "mlb-data-bot@github.com"
          git config user.name "MLB Data Bot"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: ${{ steps.date.outputs.date }}"
            git push
          fi
