name: MLB Data Pre-fetch

on:
  # The reliable trigger. A picks routine pushes a one-line change to
  # requests/data.txt ("<date> <who> <utc time>") and the bundle lands about a
  # minute later, because GitHub starts push-triggered runs right away.
  push:
    paths:
      - 'requests/data.txt'
  # Backstop only. GitHub started the old 9:00 AM ET (13:00 UTC) schedule
  # between 12:15 and 5:40 PM ET on every day from 9/22 to 10/22, so the bundle
  # never once reached the 11 AM card. Top-of-the-hour schedules are the ones
  # GitHub delays most, hence the odd minute.
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date override (YYYY-MM-DD, blank = today ET)'
        required: false
        default: ''

concurrency:
  group: data-prefetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_ODDS_KEY: ${{ secrets.ODDS_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 playwright

      # Only the covers.com scrape needs a browser, and installing one has
      # taken up to 8 minutes while a routine waits on this bundle. With The
      # Odds API key set, covers is skipped and so is this step.
      - name: Install Playwright browsers
        if: env.HAS_ODDS_KEY != 'true'
        run: playwright install chromium --with-deps

      - name: Resolve date (ET)
        id: date
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          req=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f requests/data.txt ]; then
            req=$(head -1 requests/data.txt | tr -cd 'A-Za-z0-9 :._-')
          fi
          d="$INPUT_DATE"
          [ -z "$d" ] && d=$(echo "$req" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          [ -z "$d" ] && d=$(TZ=America/New_York date +%Y-%m-%d)
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "requested_by=${req:-$GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fetch MLB data
        env:
          # Optional. With the secret set, every game gets prices from each
          # book in BOOKS (a repository variable) plus the no-vig fair line.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BOOKS: ${{ vars.BOOKS }}
          REQUESTED_BY: ${{ steps.date.outputs.requested_by }}
        run: |
          mkdir -p data
          python3 scripts/fetch_daily_data.py \
            --date "${{ steps.date.outputs.date }}" \
            --out-dir data

      - name: Commit and push
        run: |
          git config user.email "mlb-data-bot@github.com"
          git config user.name "MLB Data Bot"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: ${{ steps.date.outputs.date }}"
          # The routine that asked for this bundle can push in the meantime;
          # rebase onto its commit instead of failing the run.
          for i in 1 2 3; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
