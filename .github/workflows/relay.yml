name: MLB Relay
on:
  repository_dispatch:
    types: [mlb-picks]
  push:
    paths:
      - 'dispatch/*.txt'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_EVENT: ${{ github.event_name }}
          CLIENT_TEXT: ${{ github.event.client_payload.text }}
        run: |
          if [ "$GITHUB_EVENT" = "push" ]; then
            DISPATCH_FILE=$(git diff --name-only HEAD~1 HEAD | grep '^dispatch/' | head -1)
            MSG=$(cat "$DISPATCH_FILE")
          else
            MSG="$CLIENT_TEXT"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=8644528540" \
            --data-urlencode "text=${MSG}"
